[project]
name = "fv-data-mcp"
version = "0.1.0"
description = "Authenticated, quota-aware Finviz research tools over MCP"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=2.3,<3",
  "starlette>=1.3.1,<2",
  "uvicorn[standard]>=0.38,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "httpcore>=1,<2",
  "redis>=6,<8",
  "PyJWT[crypto]>=2.10,<3",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pandas-market-calendars>=5,<6",
  "beautifulsoup4>=4.13,<5",
  "trafilatura>=2,<3",
  "defusedxml>=0.7,<1",
  "azure-data-tables>=12.7,<13",
  "azure-storage-blob>=12.25,<13",
  "azure-identity>=1.23,<2",
  "aiohttp>=3.12,<4",
  "opentelemetry-api>=1.34,<2",
  "opentelemetry-sdk>=1.34,<2",
  "azure-monitor-opentelemetry-exporter>=1.0.0b40,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "fakeredis[lua]>=2.30,<3",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "pip-audit>=2.9,<3",
]

[project.scripts]
fv-data-mcp = "fv_data_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fv_data_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "ASYNC",
  "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",
  "D101", "D102", "D103", "D105", "D106", "D107",
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/fv_data_mcp/providers/articles.py" = ["ASYNC109"]
